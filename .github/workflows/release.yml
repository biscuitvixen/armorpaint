name: Build & Release (Windows / Linux / macOS)

# Builds the LATEST upstream armory3d/armorpaint for Windows, Linux and
# macOS and publishes them together as a single rolling GitHub Release on
# this fork. Upstream ships ArmorPaint as a paid download and has not cut a
# git tag since 23.09 (Sept 2023) while `main` keeps moving, so this fork
# exists to provide free, up-to-date community builds.
#
# A daily `check` job compares upstream HEAD against the SHA embedded in the
# latest release tag (armorpaint-<date>-<sha>). Upstream commits most days,
# so a new release is built only once the last one is about a week old;
# between those, the daily run only rebuilds the latest release when it is
# missing a platform's asset and upstream is still at the same SHA, which
# covers a matrix leg that never got a runner. `workflow_dispatch` bypasses
# the check and always builds.
#
# This fork is a stock mirror, so the build clones upstream `main` fresh and
# builds it, independent of how far behind this fork's own branches happen to
# be. Nothing is fetched at build time beyond the upstream clone: the amake
# build tool and all dependencies are vendored in the repo.

on:
  schedule:
    # Daily 06:17 UTC. Schedules on the hour are delayed most under load,
    # and hosted macOS arm64 runners are scarcest during US working hours,
    # where a job left queued for 15 minutes is cancelled unacquired; an
    # odd minute early in the UK morning avoids both. The `check` job makes
    # no-change runs cost seconds, so polling daily is cheap. NOTE: GitHub
    # only runs `schedule` from the repo's DEFAULT branch, so this branch
    # must be set as the fork's default.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_URL: https://github.com/armory3d/armorpaint.git
  UPSTREAM_BRANCH: main
  # 6.5 days: a week less slack for scheduled runs starting late, so a
  # release published a few hours after its cron does not slip a day.
  RELEASE_GAP_HOURS: 156

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      sha: ${{ steps.gate.outputs.sha }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: 🕵️ Compare upstream HEAD with last release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Must match the `asset` names in the build matrix.
          EXPECTED_ASSETS: '["ArmorPaint-linux-x64.tar.gz", "ArmorPaint-windows-x64.zip", "ArmorPaint-macos-arm64.zip"]'
        run: |
          set -euo pipefail

          SHA=$(git ls-remote "$UPSTREAM_URL" "refs/heads/$UPSTREAM_BRANCH" | cut -c1-7)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Latest release tag looks like armorpaint-<date>-<sha>; the suffix
          # is the upstream SHA that release was built from. No release yet
          # reads as an empty object, so every asset counts as missing.
          LAST=$(gh release view --json tagName,assets,publishedAt 2>/dev/null || echo '{}')
          LAST_TAG=$(jq -r '.tagName // ""' <<< "$LAST")
          LAST_SHA="${LAST_TAG##*-}"

          # Expected assets absent from that release, space-separated.
          MISSING=$(jq -r --argjson want "$EXPECTED_ASSETS" \
            '$want - [.assets[]?.name] | join(" ")' <<< "$LAST")

          # Hours since that release was published; no release reads as the
          # epoch, which is always old enough.
          PUBLISHED=$(jq -r '.publishedAt // "@0"' <<< "$LAST")
          AGE_HOURS=$(( ($(date -u +%s) - $(date -u -d "$PUBLISHED" +%s)) / 3600 ))

          # The tag is fixed here, not when publishing, so the release job
          # names what this job decided to build. A gap-fill reuses the
          # existing tag and adds the missing assets to that release.
          TAG="armorpaint-$(date -u +%Y%m%d)-$SHA"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🔧 Manual run - building regardless of upstream state."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$SHA" = "$LAST_SHA" ] && [ -n "$MISSING" ]; then
            echo "🧩 $LAST_TAG is missing: $MISSING. Rebuilding $SHA into it."
            TAG="$LAST_TAG"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$SHA" = "$LAST_SHA" ]; then
            echo "✅ Upstream $UPSTREAM_BRANCH still at $SHA (last release: ${LAST_TAG:-none}). Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$AGE_HOURS" -lt "$RELEASE_GAP_HOURS" ]; then
            echo "⏳ Upstream moved: $LAST_SHA -> $SHA, but $LAST_TAG is only ${AGE_HOURS}h old (gap: ${RELEASE_GAP_HOURS}h). Waiting."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Upstream moved: ${LAST_SHA:-none} -> $SHA. Building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset: ArmorPaint-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            asset: ArmorPaint-windows-x64.zip
          - os: macos-latest
            platform: macos
            asset: ArmorPaint-macos-arm64.zip
    steps:
      - name: 🧰 Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --quiet make clang libvulkan-dev libgtk-3-dev libasound2-dev

      - name: 📂 Clone pristine upstream (${{ env.UPSTREAM_BRANCH }})
        run: git clone --single-branch --depth 1 -b "${{ env.UPSTREAM_BRANCH }}" "${{ env.UPSTREAM_URL }}" armorpaint-src

      - name: 🔨 Build
        # Forward slashes work in every runner's default shell; on Windows
        # PowerShell resolves `../base/make` to `make.bat`. This matches
        # upstream's own per-platform smoke-test workflows.
        run: |
          cd armorpaint-src/paint
          ../base/make --compile

      - name: 📦 Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C armorpaint-src/paint/build/out -czf "dist/${{ matrix.asset }}" .
          ls -l dist

      - name: 📦 Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          # xcodebuild's output dir varies; locate the bundle rather than
          # hardcoding build/Release.
          APP=$(find armorpaint-src/paint/build -maxdepth 4 -type d -name 'ArmorPaint.app' | head -n1)
          if [ -z "$APP" ]; then echo "::error::ArmorPaint.app not found under paint/build"; exit 1; fi
          echo "Packaging $APP"
          ditto -c -k --keepParent "$APP" "dist/${{ matrix.asset }}"
          ls -l dist

      - name: 📦 Package Windows
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path armorpaint-src\paint\build\out\* -DestinationPath "dist\${{ matrix.asset }}"
          Get-ChildItem dist

      - name: 💾 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [check, build]
    # Publish even if some matrix legs failed (fail-fast is off), but not when
    # the check job decided there was nothing new to build.
    if: ${{ !cancelled() && needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Collect all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: 🏷️ Resolve version
        id: ver
        run: |
          # Use the SHA the check job saw, not a fresh ls-remote: if upstream
          # moves mid-build, the tag should still match what was built.
          echo "sha=${{ needs.check.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ needs.check.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: 📦 List collected files
        run: ls -l dist || true

      - name: 🚀 Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ArmorPaint (upstream ${{ steps.ver.outputs.sha }})
          body: |
            Automated community build of ArmorPaint for Windows, Linux and macOS.

            - Built from upstream [`armory3d/armorpaint`](https://github.com/armory3d/armorpaint/commit/${{ steps.ver.outputs.sha }}) `${{ env.UPSTREAM_BRANCH }}` @ `${{ steps.ver.outputs.sha }}`
            - Stock upstream sources, nothing added.

            **Downloads**
            - Windows x64: `ArmorPaint-windows-x64.zip`
            - Linux x64: `ArmorPaint-linux-x64.tar.gz`
            - macOS arm64: `ArmorPaint-macos-arm64.zip`

            **macOS note:** the `.app` is unsigned, so the first launch is
            blocked by Gatekeeper. Right-click the app and choose *Open*, or
            run `xattr -dr com.apple.quarantine ArmorPaint.app`.
          files: dist/*
          fail_on_unmatched_files: false
